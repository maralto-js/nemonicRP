name: 🐛 Relatar Bug
description: Reportar um problema/bug no servidor
title: "[BUG] "
labels: ["bug", "needs-testing"]

body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar um bug! Preencha os detalhes abaixo.

  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu de errado?
      placeholder: Descreva o bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para Reproduzir
      description: Como reproduzir o bug?
      placeholder: |
        1. Entre no servidor
        2. Vá para [local]
        3. Faça [ação]
        4. Bug ocorre
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento Esperado
      description: O que deveria acontecer?
      placeholder: Descreva o comportamento correto...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severidade
      options:
        - 🔴 Crítico (impede jogar)
        - 🟠 Alto (gameplay prejudicado)
        - 🟡 Médio (incômodo)
        - 🔵 Baixo (cosmético)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs/Screenshots
      description: Cole logs ou screenshots (opcional)
      placeholder: Cole aqui...
